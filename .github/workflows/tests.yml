name: NEX AI Regression Tests
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test self-healing retries
        run: python test_self_healing.py
      - name: Test Local Agent command workflow
        run: python test_agent_commands.py
      - name: Test end-to-end Local Agent lifecycle
        run: python test_agent_e2e.py
      - name: Test Local Agent client protocol
        run: python test_local_agent_client.py
      - name: Test Local Agent schema migrations
        run: python test_agent_migrations.py
      - name: Test customer ownership isolation
        run: python test_task_ownership.py
